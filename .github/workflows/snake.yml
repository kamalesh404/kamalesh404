name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: kamalesh4044
          outputs: |
            dist/github-snake-dark.svg?color_snake=0ea5e9&color_dots=0f172a,#1e3a5f,#0ea5e9,#06d6a0,#ffd166
            dist/github-snake.svg?color_snake=3b82f6&color_dots=ffffff,#e2e8f0,#3b82f6,#06b6d4,#8b5cf6

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
