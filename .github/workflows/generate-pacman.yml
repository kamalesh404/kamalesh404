name: generate pacman game

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Replace Pac-Man with avatar
        run: |
          cat > replace-pacman.js << 'ENDSCRIPT'
          const fs = require('fs');
          const path = require('path');
          
          const distDir = path.join(__dirname, 'dist');
          const files = fs.readdirSync(distDir).filter(f => f.endsWith('.svg'));
          
          const AVATAR_URL = 'https://avatars.githubusercontent.com/u/228681348?v=4';
          
          files.forEach(file => {
            const filePath = path.join(distDir, file);
            let content = fs.readFileSync(filePath, 'utf8');
            
            // Step 1: Replace the Pac-Man path element with avatar image
            // Pac-Man is: <path d="M 10,10 L ... A ... Z" fill="yellow">
            // We replace the opening tag to become an image element
            content = content.replace(
              /<path\s+d="M 10,10[^"]*"\s+fill="yellow">/,
              `<image x="0" y="0" width="20" height="20" href="${AVATAR_URL}">`
            );
            
            // Step 2: Remove the fill color animation (yellow/red/gray cycling)
            // This animation changes the fill color which doesn't apply to images
            content = content.replace(
              /<animate\s+attributeName="fill"\s+dur="117800ms"\s+repeatCount="indefinite"\s+calcMode="discrete"\s*\n\s*values="yellow;[^"]*"\s*\/>/g,
              ''
            );
            
            // Also handle single-line fill animation variant
            content = content.replace(
              /<animate attributeName="fill" dur="117800ms" repeatCount="indefinite" calcMode="discrete"\s+values="yellow;[^"]*"\/>/g,
              ''
            );
            
            // Step 3: Remove the mouth animation (path "d" morphing)
            // This animates the mouth open/close which doesn't apply to images
            content = content.replace(
              /<animate\s+attributeName="d"\s+dur="0\.5s"\s+repeatCount="indefinite"\s*\n?\s*values="[^"]*"\s*\/>/g,
              ''
            );
            
            // Also handle single-line d animation variant
            content = content.replace(
              /<animate attributeName="d" dur="0\.5s" repeatCount="indefinite"\s+values="[^"]*"\/>/g,
              ''
            );
            
            fs.writeFileSync(filePath, content);
            console.log(`Processed: ${file}`);
          });
          ENDSCRIPT
          
          node replace-pacman.js

      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
