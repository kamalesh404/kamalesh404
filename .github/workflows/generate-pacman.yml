name: generate pacman game

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore custom face sprite
        run: |
          mkdir -p assets
          base64 -d assets/pacman-face.txt > assets/pacman-face.png
          file assets/pacman-face.png

      - name: Replace Pac-Man with custom face
        run: |
          cat > replace-pacman.js << 'ENDSCRIPT'
          const fs = require('fs');
          const path = require('path');

          const distDir = path.join(__dirname, 'dist');
          const files = fs.readdirSync(distDir).filter(f => f.endsWith('.svg'));
          const facePath = path.join(__dirname, 'assets', 'pacman-face.png');
          const faceBase64 = fs.readFileSync(facePath).toString('base64');
          const FACE_DATA_URI = `data:image/png;base64,${faceBase64}`;

          files.forEach(file => {
            const filePath = path.join(distDir, file);
            let content = fs.readFileSync(filePath, 'utf8');

            // Replace the complete Pac-Man path, including its original animation,
            // with the custom face image. The contribution dots and their positions
            // are generated by the original action and are not modified.
            const customFace = `<image id="pacman" x="0" y="0" width="20" height="20" preserveAspectRatio="xMidYMid meet" href="${FACE_DATA_URI}" />`;
            const pacmanBlock = /<path\s+id="pacman"\b[\s\S]*?<\/path>/g;
            const before = content;
            content = content.replace(pacmanBlock, customFace);

            // Fallback for a self-closing Pac-Man path.
            content = content.replace(
              /<path\s+id="pacman"\b[^>]*\/>/g,
              customFace
            );

            if (content === before) {
              console.warn(`Pac-Man path not found in ${file}`);
            } else {
              console.log(`Custom face installed in ${file}`);
            }

            fs.writeFileSync(filePath, content);
          });
          ENDSCRIPT

          node replace-pacman.js

      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
