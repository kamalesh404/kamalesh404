name: generate pacman game

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Replace Pac-Man with avatar
        run: |
          cat > replace-pacman.js << 'EOF'
          const fs = require('fs');
          const path = require('path');
          
          const distDir = path.join(__dirname, 'dist');
          const files = fs.readdirSync(distDir).filter(f => f.endsWith('.svg'));
          
          const AVATAR_URL = 'https://avatars.githubusercontent.com/u/228681348?v=4';
          
          files.forEach(file => {
            const filePath = path.join(distDir, file);
            let content = fs.readFileSync(filePath, 'utf8');
            
            // Replace yellow Pac-Man circle with avatar image
            // The Pac-Man is a circle with fill="#FFE000" or similar yellow
            content = content.replace(
              /<circle[^>]*fill="#FFE000"[^>]*\/>/g,
              `<image x="-14" y="-14" width="28" height="28" href="${AVATAR_URL}" clip-path="url(#avatar-clip)"/>`
            );
            
            // Also try other yellow shades
            content = content.replace(
              /<circle[^>]*fill="#ffd700"[^>]*\/>/g,
              `<image x="-14" y="-14" width="28" height="28" href="${AVATAR_URL}" clip-path="url(#avatar-clip)"/>`
            );
            
            // Add clipPath definition if not present
            if (!content.includes('id="avatar-clip"')) {
              content = content.replace(
                '<defs>',
                '<defs><clipPath id="avatar-clip"><circle cx="0" cy="0" r="14"/></clipPath>'
              );
            }
            
            fs.writeFileSync(filePath, content);
            console.log(`Processed: ${file}`);
          });
          EOF
          
          node replace-pacman.js

      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
