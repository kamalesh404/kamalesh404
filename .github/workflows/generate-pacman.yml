name: generate pacman game

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore custom face sprite
        run: |
          test -f assets/pacman-face.txt
          base64 -d assets/pacman-face.txt > assets/pacman-face.png
          file assets/pacman-face.png
          test -s assets/pacman-face.png

      - name: Replace Pac-Man with custom face
        run: |
          cat > replace-pacman.js << 'ENDSCRIPT'
          const fs = require('fs');
          const path = require('path');

          const distDir = path.join(__dirname, 'dist');
          const facePath = path.join(__dirname, 'assets', 'pacman-face.png');
          const faceBase64 = fs.readFileSync(facePath).toString('base64');
          const FACE_DATA_URI = `data:image/png;base64,${faceBase64}`;

          const files = fs.readdirSync(distDir).filter(f => f.endsWith('.svg'));
          let replaced = 0;

          files.forEach(file => {
            const filePath = path.join(distDir, file);
            let content = fs.readFileSync(filePath, 'utf8');

            // Keep Pac-Man's original translate + rotate animations, but replace
            // only its visual path with the user's face image. This makes the
            // face travel over the same contribution cells as the original Pac-Man.
            const pacmanBlock = /<path\s+id="pacman"[^>]*>([\\s\\S]*?)<\\/path>/g;
            const before = content;

            content = content.replace(pacmanBlock, (match, inner) => {
              const transforms = inner.match(/<animateTransform\\b[^>]*\\/>/g) || [];
              return `<g id="pacman">\n  <image x="0" y="0" width="20" height="20" preserveAspectRatio="xMidYMid meet" href="${FACE_DATA_URI}" />\n  ${transforms.join('\n  ')}\n</g>`;
            });

            // Fallback if the upstream renderer ever emits a self-closing path.
            content = content.replace(
              /<path\s+id="pacman"[^>]*\/>/g,
              `<image id="pacman" x="0" y="0" width="20" height="20" preserveAspectRatio="xMidYMid meet" href="${FACE_DATA_URI}" />`
            );

            if (content !== before) {
              replaced++;
              console.log(`Custom animated face installed in ${file}`);
            } else {
              console.warn(`Pac-Man path not found in ${file}`);
            }

            fs.writeFileSync(filePath, content);
          });

          if (replaced === 0) {
            throw new Error('Pac-Man path was not found in any generated SVG');
          }
          ENDSCRIPT

          node replace-pacman.js

      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}