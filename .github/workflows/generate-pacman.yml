name: generate pacman game

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Replace Pac-Man with custom face
        run: |
          cat > replace-pacman.js << 'ENDSCRIPT'
          const fs = require('fs');
          const path = require('path');
          
          const distDir = path.join(__dirname, 'dist');
          const files = fs.readdirSync(distDir).filter(f => f.endsWith('.svg'));
          
          // Use the repository-hosted transparent face sprite instead of the GitHub avatar.
          const FACE_URL = 'https://raw.githubusercontent.com/kamalesh404/kamalesh404/main/assets/pacman-face.png';
          
          files.forEach(file => {
            const filePath = path.join(distDir, file);
            let content = fs.readFileSync(filePath, 'utf8');
            
            // Replace only the Pac-Man character. Keep the generated contribution dots,
            // paths, ghosts and animation timings untouched.
            content = content.replace(
              /<path\s+id="pacman"\b[^>]*>/g,
              '<image id="pacman" x="0" y="0" width="20" height="20" preserveAspectRatio="xMidYMid meet" href="' + FACE_URL + '" />'
            );
            
            // Remove the original Pac-Man fill animation if it remains in the generated SVG.
            content = content.replace(
              /<animate\b[^>]*attributeName="fill"[^>]*values="yellow;[^"]*"[^>]*\/>/g,
              ''
            );
            
            fs.writeFileSync(filePath, content);
            console.log(`Processed: ${file}`);
          });
          ENDSCRIPT
          
          node replace-pacman.js

      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
