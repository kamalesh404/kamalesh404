name: generate pacman game

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: generate contribution graph SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: 'pacman'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore custom face sprite
        run: |
          test -f assets/pacman-face.txt
          base64 -d assets/pacman-face.txt > assets/pacman-face.png
          file assets/pacman-face.png
          test -s assets/pacman-face.png

      - name: Replace Pac-Man with custom face
        run: |
          cat > replace-pacman.js << 'ENDSCRIPT'
          const fs = require('fs');
          const path = require('path');

          const distDir = path.join(__dirname, 'dist');
          const facePath = path.join(__dirname, 'assets', 'pacman-face.png');
          const faceBase64 = fs.readFileSync(facePath).toString('base64');
          const FACE_DATA_URI = `data:image/png;base64,${faceBase64}`;

          const files = fs.readdirSync(distDir).filter(f => f.endsWith('.svg'));
          let replaced = 0;

          for (const file of files) {
            const filePath = path.join(distDir, file);
            let content = fs.readFileSync(filePath, 'utf8');
            let searchFrom = 0;
            let fileReplaced = 0;

            // Avoid regex escaping issues. Find the Pac-Man path directly,
            // preserve its translate/rotate animations, and replace only the
            // visual shape with the user's face image.
            while (true) {
              const start = content.indexOf('<path id="pacman"', searchFrom);
              if (start === -1) break;

              const openEnd = content.indexOf('>', start);
              const closeEnd = content.indexOf('</path>', openEnd);
              if (openEnd === -1 || closeEnd === -1) {
                throw new Error(`Malformed Pac-Man path in ${file}`);
              }

              const inner = content.slice(openEnd + 1, closeEnd);
              const transforms = inner
                .split('\n')
                .map(line => line.trim())
                .filter(line => line.startsWith('<animateTransform'));

              const replacement = `<g id="pacman">\n  <image x="0" y="0" width="20" height="20" preserveAspectRatio="xMidYMid meet" href="${FACE_DATA_URI}" />\n  ${transforms.join('\n  ')}\n</g>`;

              content = content.slice(0, start) + replacement + content.slice(closeEnd + '</path>'.length);
              searchFrom = start + replacement.length;
              fileReplaced++;
            }

            if (fileReplaced > 0) {
              replaced += fileReplaced;
              console.log(`Custom animated face installed in ${file}: ${fileReplaced}`);
            } else {
              console.warn(`Pac-Man path not found in ${file}`);
            }

            fs.writeFileSync(filePath, content);
          }

          if (replaced === 0) {
            throw new Error('Pac-Man path was not found in any generated SVG');
          }
          ENDSCRIPT

          node replace-pacman.js

      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}